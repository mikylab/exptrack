name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run legacy test runner
        run: |
          python tests/run_all.py

  # exptrack's headline feature is monkey-patching argparse / matplotlib /
  # TensorBoard, but those libraries aren't needed to *run* exptrack, so the
  # tests covering them skip on the matrix above. This job installs them so an
  # upstream signature change is caught here rather than by a user.
  integrations:
    name: Patched-library integrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,integrations]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      # The point of this job is that these tests actually run. If an import
      # breaks they would silently skip again, the suite would still pass
      # green, and the coverage would be gone with nobody noticing.
      - name: Fail if the integration tests skipped
        run: |
          pytest tests/ -q -rs | tee result.txt
          if grep -qE "matplotlib not installed|could not import '(pandas|numpy)'|numpy not installed" result.txt; then
            echo "::error::Integration tests skipped despite the integrations extra being installed."
            exit 1
          fi

  # Process management is the one kind of code that differs per operating
  # system, and this release runs on three. A release shipped a Critical
  # Windows bug (os.kill(pid, 0) is not a liveness probe on Windows --
  # signal.CTRL_C_EVENT == 0, so it routes to GenerateConsoleCtrlEvent --
  # which made every live detached dashboard read as dead) through code
  # review and a full unit-test suite, because CI only ever ran Ubuntu.
  # This job exists to make sure that gap never reopens: it runs the
  # lifecycle/auth/tunnel/encoding surface on macOS and Windows, where
  # process and filesystem semantics actually differ from Linux.
  platforms:
    name: ${{ matrix.os }} (lifecycle)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lifecycle, auth, perms, tunnel, encoding and project tests
        run: >-
          pytest
          tests/test_dashboard_daemon.py
          tests/test_dashboard_auth.py
          tests/test_dashboard_perms.py
          tests/test_cli_ui.py
          tests/test_tunnel.py
          tests/test_config_encoding.py
          tests/test_dashboard_routing.py
          tests/test_project_resolution.py
          tests/test_projects.py
          tests/test_cli_project.py
          tests/test_dashboard_projects.py
          -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ESLint (dashboard JS)
        run: |
          npm ci
          npx eslint exptrack/dashboard/static/js
